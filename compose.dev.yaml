# Dev override - extends compose.yaml. Selected through COMPOSE_FILE in
# docker/.env (`castor init:env`), so plain `docker compose` works once that
# file exists; the castor tasks always name it explicitly.

services:
    shop:
        image: ${DOCKER_REGISTRY}/php:dev
        build:
            # The repository root (see .dockerignore).
            context: .
            dockerfile: docker/php/Dockerfile
            target: frankenphp_dev
            args:
                PHP_VERSION: ${PHP_VERSION}
                USER: ${PROJECT_USER}
                USER_ID: ${PROJECT_USER_ID}
                GROUP_ID: ${PROJECT_GROUP_ID}
        user: "${PROJECT_USER_ID}:${PROJECT_GROUP_ID}"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            # The shop runs as a real shop would (prod, no debug) unless
            # .project.ini says otherwise; the other apps below stay in dev.
            APP_ENV: ${SHOP_APP_ENV:-prod}
            APP_DEBUG: ${SHOP_APP_DEBUG:-0}
            XDEBUG_MODE: ${XDEBUG_MODE:-off}
            PHP_IDE_CONFIG: "serverName=sylius-assistant-stack"
            DOCKER_CONTAINER: "1"
        ports:
            - "80:80"
        volumes:
            - .:/srv/app:rw,cached
            - ${COMPOSER_AUTH_JSON:-/dev/null}:/home/${PROJECT_USER}/.composer/auth.json:ro

    # Dev half of the worker: same build, user, bind mounts and env as `shop`
    # (extends the dev fragment above); only the published port is dropped.
    shop-worker:
        extends:
            service: shop
        ports: !reset []

    # Dev half of the MCP server: build, user, bind mounts and dev env of
    # `shop`, its own published port and Keycloak dependency.
    mcp-server:
        extends:
            service: shop
        environment:
            APP_ENV: dev
            APP_DEBUG: 1
            # cloudflared (compose.tunnel.yaml) is the one proxy whose
            # X-Forwarded-* we honour; the default trusts loopback only.
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
            # The dev realm adds this audience to its tokens (.castor/keycloak-realm.php).
            MCP_AUTH_AUDIENCE: sylius-mcp
        ports: !override
            - "${MCP_SERVER_PORT}:80"

    # Dev half of the MCP server's consumers: the dev fragment of mcp-server,
    # without its port.
    mcp-tasks-worker:
        extends:
            service: mcp-server
        ports: !reset []

    mcp-agents-worker:
        extends:
            service: mcp-server
        ports: !reset []

    mcp-scheduler:
        extends:
            service: mcp-server
        ports: !reset []

    database:
        ports:
            - "3306:3306"

    # Published on host :8085 so the issuer `http://keycloak:8085` is identical
    # from the browser (/etc/hosts: `127.0.0.1 keycloak`) and from the
    # containers (compose DNS): that symmetry keeps the OIDC issuer check happy
    # on both the browser authorization-code flow and the server-side validation.
    keycloak:
        ports:
            - "8085:8085"

    mailpit:
        ports:
            - "8025:8025"
            - "1025:1025"
