; OVERRIDE: .project.local.ini
; DESC: Fully resolved configuration will be written to .project.local.ini
; DESC: .project.local.ini MUST be git-ignored and NEVER committed
; DESC: Resolution creates a complete configuration with all keys

[project]
; DESC: Project identifier (vendor/package format, lowercase, hyphen-separated)
; CHECK: value MUST NOT equal "CHANGE_ME"
name = "emagma/sylius-assistant-stack"

; DESC: Short slug used for git URL, Docker project name, and directory naming
; CHECK: value MUST NOT equal "CHANGE_ME"
slug = "sylius-assistant-stack"

; DESC: Short description of the project (one sentence)
; CHECK: value MUST NOT equal "CHANGE_ME"
description = "Sylius Assistant stack - a Sylius shop, its MCP server and a test chat, as one compose stack."

; DESC: Project environment (dev, staging, preprod, prod)
; EXPORT: ./docker/.env dotenv PROJECT_ENV
environment = "dev"

; DESC: Project git repository URL
git_repository = "https://github.com/emagma/symfony-ai-hackathon-2026.git"

[apps.shop]
; DESC: The Sylius application (sylius/sylius-standard) the MCP plugin is installed in
package = "sylius/sylius-standard"
; DESC: Sylius release line
release = "~2.3.0"
; DESC: Path of the app in the monorepo
path = "apps/shop"
; DESC: Domain name for the shop (local HTTPS via mkcert, not wired yet)
; SOURCE: derived from project slug
; EXPORT: ./docker/.env dotenv SHOP_DOMAIN_NAME
domain = "shop.sylius-assistant-stack.emagma"

; DESC: Default locale of the shop and of the MCP tools' translations
; EXPORT: ./docker/.env dotenv SHOP_DEFAULT_LOCALE
default_locale = "en_US"

; DESC: Symfony environment of the shop container (dev or prod). prod runs the
; standard as a real shop would: no profiler, compiled container, assets as built.
; EXPORT: ./docker/.env dotenv SHOP_APP_ENV
app_env = "prod"

; DESC: Symfony debug flag of the shop container (1 or 0)
; EXPORT: ./docker/.env dotenv SHOP_APP_DEBUG
app_debug = "0"

; DESC: The admin page "Reset demo data" (Configuration menu): any admin can wipe
; the shop back to its fixtures (1 or 0; the shop's own default is 0)
; EXPORT: ./docker/.env dotenv SHOP_FIXTURES_RESET_ENABLED
fixtures_reset_enabled = "1"

; DESC: Symfony APP_SECRET of the shop
; SENSITIVE: MUST NOT be committed with a real value
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: generate random secret
; RUN: openssl rand -hex 32
; CHECK: value MUST NOT equal "CHANGE_ME"
; EXPORT: ./docker/.env dotenv SHOP_APP_SECRET
app_secret = "CHANGE_ME"

[apps.shop.database]
; DESC: Docker image for the database server (shared by the shop and the MCP server, two databases).
; MySQL rather than MariaDB: with doctrine/dbal 4 the Sylius migrations skip
; themselves on MariaDB ("can only be executed on MySQL"), leaving an empty schema.
; EXPORT: ./docker/.env dotenv SHOP_DATABASE_IMAGE
image = "mysql:8.4"

; DESC: Database name of the shop
; EXPORT: ./docker/.env dotenv SHOP_DATABASE_NAME
name = "shop_dev"

; DESC: Database user of the shop
; EXPORT: ./docker/.env dotenv SHOP_DATABASE_USER
user = "shop"

; DESC: Password of the shop database user
; SENSITIVE: MUST NOT be committed with a real value
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: generate random password
; RUN: openssl rand -hex 32
; CHECK: value MUST NOT equal "CHANGE_ME"
; EXPORT: ./docker/.env dotenv SHOP_DATABASE_PASSWORD
password = "CHANGE_ME"

; DESC: Root password of the database server
; SENSITIVE: MUST NOT be committed with a real value
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: generate random password
; RUN: openssl rand -hex 32
; CHECK: value MUST NOT equal "CHANGE_ME"
; EXPORT: ./docker/.env dotenv SHOP_DATABASE_ROOT_PASSWORD
root_password = "CHANGE_ME"

[apps.mcp-server]
; DESC: The MCP server (standalone Symfony app) exposing the shop's admin to LLMs
path = "apps/mcp-server"
; DESC: Host port of the MCP server (/_mcp)
; EXPORT: ./docker/.env dotenv MCP_SERVER_PORT
port = "8081"

; DESC: Email of the Sylius admin the MCP server calls the Admin API with (one service account for every MCP user)
; EXPORT: ./docker/.env dotenv MCP_SERVICE_ACCOUNT_EMAIL
service_account_email = "mcp-server@sylius-assistant-stack.emagma"

; DESC: Password of that service account (created in the shop by `castor shop:db`)
; SENSITIVE: MUST NOT be committed with a real value
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: generate random password
; RUN: openssl rand -hex 32
; CHECK: value MUST NOT equal "CHANGE_ME"
; EXPORT: ./docker/.env dotenv MCP_SERVICE_ACCOUNT_PASSWORD
service_account_password = "CHANGE_ME"

; DESC: Shop extensions whose MCP tools the server offers, comma-separated (the names the installed bundles declare; empty = none, the server's own default). Checked against the shop by `castor init:verify`
; EXPORT: ./docker/.env dotenv MCP_SHOP_EXTENSIONS
shop_extensions = ""

; DESC: Sylius version of the shop (2.0, 2.1, 2.2, 2.3, optionally with a patch): picks the Admin API routes of its line and hides the MCP tools it lacks. Checked against the shop by `castor init:verify`
; EXPORT: ./docker/.env dotenv MCP_SYLIUS_VERSION
sylius_version = "2.3"

; DESC: Symfony APP_SECRET of the MCP server (also the default key of the pseudonymising tokens, see MCP_PRIVACY_SECRET)
; SENSITIVE: MUST NOT be committed with a real value
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: generate random secret
; RUN: openssl rand -hex 32
; CHECK: value MUST NOT equal "CHANGE_ME"
; EXPORT: ./docker/.env dotenv MCP_APP_SECRET
app_secret = "CHANGE_ME"

; DESC: Symfony Messenger DSN of the passes of the background agents (transport mcp_agents, consumed by mcp-agents-worker). Empty = a queue of the server's database (doctrine://default?queue_name=mcp_agents); Redis or AMQP are a matter of this value
; EXPORT: ./docker/.env dotenv MCP_AGENTS_TRANSPORT_DSN
agents_transport_dsn = ""

; DESC: Symfony Messenger DSN of what leaves the server, emails and notifications (transport async, consumed by mcp-agents-worker). Empty = a queue of the server's database (doctrine://default?queue_name=async)
; EXPORT: ./docker/.env dotenv MCP_ASYNC_TRANSPORT_DSN
async_transport_dsn = ""
[apps.mcp-server.database]
; DESC: Database of the MCP server (its audit), on the shared server
; EXPORT: ./docker/.env dotenv MCP_DATABASE_NAME
name = "mcp_server_dev"

; DESC: Database user of the MCP server
; EXPORT: ./docker/.env dotenv MCP_DATABASE_USER
user = "mcp"

; DESC: Password of the MCP server database user
; SENSITIVE: MUST NOT be committed with a real value
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: generate random password
; RUN: openssl rand -hex 32
; CHECK: value MUST NOT equal "CHANGE_ME"
; EXPORT: ./docker/.env dotenv MCP_DATABASE_PASSWORD
password = "CHANGE_ME"

[apps.chat]
; DESC: The local test chat, an MCP client of the MCP server driven by OpenAI, Anthropic, Mistral or Qwen
path = "apps/chat"
; DESC: Host port of the test chat
; EXPORT: ./docker/.env dotenv CHAT_PORT
port = "8090"

[infrastructure.docker]
; DESC: Name prefix of the container image, a local name: the image is built here, never pulled
; EXPORT: ./docker/.env dotenv DOCKER_REGISTRY
registry = "emagma-agent-backend"

; DESC: Docker Compose project name
; SOURCE: derived from project slug
; EXPORT: ./docker/.env dotenv PROJECT_NAME
project_name = "sylius-assistant-stack"

; DESC: Active compose files for the dev workflow (compose.tunnel.yaml is appended by `castor tunnel:up`)
; EXPORT: ./docker/.env dotenv COMPOSE_FILE
compose_file = "compose.yaml:compose.dev.yaml:compose.chat.yaml"

; DESC: Path to Composer auth.json on the host
; DEFAULT: ~/.composer/auth.json
; EXPORT: ./docker/.env dotenv COMPOSER_AUTH_JSON
composer_auth_json = "~/.composer/auth.json"

; DESC: Host user name used inside containers (matches host for bind-mount permissions)
; DEFAULT: derived from $USER
; EXPORT: ./docker/.env dotenv PROJECT_USER
project_user = "app"

; DESC: Host user UID
; DEFAULT: output of id -u
; ACTION: resolve host UID
; RUN: id -u
; EXPORT: ./docker/.env dotenv PROJECT_USER_ID
project_user_id = "1000"

; DESC: Host user GID
; DEFAULT: output of id -g
; ACTION: resolve host GID
; RUN: id -g
; EXPORT: ./docker/.env dotenv PROJECT_GROUP_ID
project_group_id = "1000"

[infrastructure.docker.php]
; DESC: PHP version of the single image shared by the three apps
; EXPORT: ./docker/.env dotenv PHP_VERSION
version = "8.4"

; DESC: PHP extensions to install in the image
; EXPORT: ./docker/.env env_quoted PHP_EXTENSIONS
extensions = "openssl opcache imagick exif gd intl pdo_mysql sysvsem uuid zip"

[infrastructure.docker.mailpit]
; DESC: Mailer DSN (Mailpit SMTP, the mail catcher of the stack)
; EXPORT: ./docker/.env dotenv SHOP_MAILER_DSN
mailer_dsn = "smtp://mailpit:1025"

[infrastructure.ai.openai]
; DESC: OpenAI API key for the local test chat (apps/chat) - https://platform.openai.com/api-keys
; DESC: Empty = the provider is greyed out in the chat. Never commit a real key.
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: ask the developer for the key (cannot be generated)
; EXPORT: ./docker/.env dotenv TESTCHAT_OPENAI_API_KEY
api_key = ""

[infrastructure.ai.anthropic]
; DESC: Anthropic API key for the local test chat (apps/chat) - https://console.anthropic.com/settings/keys
; DESC: Also the MCP server's own model provider (MCP_AI_ANTHROPIC_API_KEY in compose.yaml) for its background tools and agents.
; DESC: Empty = the provider is greyed out in the chat. Never commit a real key.
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: ask the developer for the key (cannot be generated)
; EXPORT: ./docker/.env dotenv TESTCHAT_ANTHROPIC_API_KEY
api_key = ""

[infrastructure.ai.mistral]
; DESC: Mistral API key for the local test chat (apps/chat) - https://console.mistral.ai/api-keys
; DESC: Empty = the provider is greyed out in the chat. Never commit a real key.
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: ask the developer for the key (cannot be generated)
; EXPORT: ./docker/.env dotenv TESTCHAT_MISTRAL_API_KEY
api_key = ""

[infrastructure.ai.qwen]
; DESC: Qwen (Alibaba Cloud Model Studio / DashScope) API key for the local test chat (apps/chat) - https://modelstudio.console.alibabacloud.com
; DESC: Empty = the provider is greyed out in the chat. Never commit a real key.
; SENSITIVE: MUST be stored in .project.local.ini
; ACTION: ask the developer for the key (cannot be generated)
; EXPORT: ./docker/.env dotenv TESTCHAT_QWEN_API_KEY
api_key = ""

; DESC: DashScope OpenAI-compatible base URL, WITHOUT /v1 (the generic bridge appends it).
; DESC: International region by default; use https://dashscope.aliyuncs.com/compatible-mode for mainland China keys.
; EXPORT: ./docker/.env dotenv TESTCHAT_QWEN_BASE_URL
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode"
